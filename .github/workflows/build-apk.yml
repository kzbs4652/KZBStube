name: Build and Release KZBStube APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Sürüm Etiketi (Örn: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build KZBStube Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KZBStube-${{ env.TAG_NAME }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KZBStube.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KZBStube-APK
          path: build/app/outputs/flutter-apk/KZBStube.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "KZBStube ${{ env.TAG_NAME }}"
          body: |
            ## 🚀 KZBStube ${{ env.TAG_NAME }} Güncellemesi
            
            KZBStube YouTube Video ve Müzik İndirici'nin en güncel sürümüdür.
            
            ### ✨ Yenilikler:
            - İlk resmi yazılım sürümü (v1.0.0).
            - YouTube video (MP4) ve müzik (MP3) yüksek hızlı indirme desteği.
            - YouTube linki veya başlıkla doğrudan arama motoru.
            - Otomatik pano (clipboard) algılama.
            - Koyu kırmızı premium arayüz teması.
            - Uygulama içi otomatik güncelleme mekanizması.
            
            ### 📲 Kurulum:
            Aşağıdaki `KZBStube.apk` dosyasını Android telefonunuza indirip kurabilirsiniz.
          files: |
            build/app/outputs/flutter-apk/KZBStube.apk
            build/app/outputs/flutter-apk/KZBStube-${{ env.TAG_NAME }}.apk
          draft: false
          prerelease: false
